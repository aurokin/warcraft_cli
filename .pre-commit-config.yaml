# Optional local hooks — install with: make pre-commit-install
# CI enforces the same checks via .github/workflows/ci.yml

minimum_pre_commit_version: "3.5.0"

default_language_version:
  python: python3.12

repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: make lint
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: make typecheck
        language: system
        pass_filenames: false
      - id: import-linter-boundaries
        name: import-linter boundaries
        entry: make lint-boundaries
        language: system
        pass_filenames: false
      - id: complexity-gate
        name: complexity gate (xenon)
        entry: make complexity-gate
        language: system
        pass_filenames: false
      - id: deadcode
        name: dead code (vulture)
        entry: make deadcode
        language: system
        pass_filenames: false
      - id: compileall-packages
        name: compileall packages
        entry: make fmt-check
        language: system
        pass_filenames: false
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
