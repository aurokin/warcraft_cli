[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "warcraft-cli"
version = "0.5.0"
description = "Umbrella Warcraft CLI"
requires-python = ">=3.12"
dependencies = [
  "blizzard-api-cli>=0.1.0",
  "click>=8.1.0,<9.0.0",
  "curseforge-cli>=0.1.0",
  "icy-veins-cli>=0.1.0",
  "lorrgs-cli>=0.1.0",
  "method-cli>=0.1.0",
  "raidbots-cli>=0.1.0",
  "raiderio-cli>=0.1.0",
  "simc-cli>=0.1.0",
  "typer>=0.12.5,<1.0.0",
  "warcraft-content-cli>=0.1.0",
  "warcraft-core-cli>=0.1.0",
  "warcraft-wiki-cli>=0.1.0",
  "warcraftlogs-cli>=0.1.0",
  "wowhead-cli>=0.1.0",
  "wowprogress-cli>=0.1.0",
]

[project.scripts]
warcraft = "warcraft_cli.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/warcraft_cli"]
