[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "method-cli"
version = "0.5.0"
description = "Method.gg CLI"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.13.0,<5.0.0",
  "httpx>=0.28.1,<1.0.0",
  "typer>=0.12.5,<1.0.0",
  "warcraft-api-cli>=0.1.0",
  "warcraft-content-cli>=0.1.0",
  "warcraft-core-cli>=0.1.0",
]

[project.scripts]
method = "method_cli.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/method_cli"]
