    WH.markup.printHtml("[toc]\r\n\r\n[h2]About this guide[\/h2]\r\nThis guide will hopefully outline a little more about the Loremaster achievement and how you can obtain it along with a few tips and tricks along the way.\r\n\r\n**I don't have any access to Shadownlands beta so I've not been able to start an update for the upcoming xpac. I will try to have this done as soon as I can after the xpac launches**\r\n\r\n[h2]So what\u2019s changed?[\/h2]\r\nSince the last update of this guide all the zones now follow the same style. Gone are the days of \u201cComplete 70 quests in Eastern Plaguelands\u201d and we\u2019re now in a \u201cComplete the storyline\u201d style eg. [url=achievement=4892]Eastern Plagulands Quests[\/url]\r\nSo now you actually get to follow the lore and story arc of a zone. How befitting of a Loremaster.\r\nAlso - Zone scaling. Just that little update they dropped in.\r\n\r\n[h3]What does this actually mean for me?[\/h3]\r\nFirstly, in my opinion this makes the whole task more engaging. I feel like I\u2019m now involved in a plot rather than just running around clearing all the little orange ! on the map.\r\n\r\nAlong with zone scaling this presents the perfect opportunity to level up some alts and visit zones you haven\u2019t previously completed. Zone scaling has also meant that it\u2019s harder to break a quest where you\u2019re not required to kill a mob, rather weaken it. So long as you\u2019re at a level reasonably appropriate to the zone range.\r\n\r\n[h2]Where to begin[\/h2]\r\nIt\u2019s worth noting that this storyline style has been in place since Mists of Pandaria so if you\u2019ve been playing since then you\u2019ve probably made a fairly good start.\r\n[url=achievement=11157]Loremaster of Legion[\/url] and [url=achievement=9833]Loremaster of Draenor[\/url] have both been required to unlock flying for their respective continents so you may have already completed these.\r\nSo my advice is to look back and ensure that you\u2019ve complete the BFA questlines, then the Legion zones, Warlords, and then Pandaria.\r\n\r\nBattle for Azeroth doesn\u2019t have \u201cLoremaster of\u201d achievements, rather it has [url=achievement=12593] Kul Tourist[\/url] and [url=achievement=12479]Zandalar Forever![\/url]\r\n[i]Sidenote: These aren't required for [url=achievement=7520]The Loremaster[\/url] but you can hardly call yourself a Loremaster if you don't get them![\/i]\r\n\r\nFor a more on the BFA Pathfinder to unlock flying please see [url=guide=6213]this guide[\/url]\r\n\r\nOnce you\u2019ve looked at the more recent expansions take a look at the zones for Cataclysm*, Northrend, Outland, and Eastern Kingdoms & Kalimdor.\r\n\r\nThe Vanilla zones are really the most daunting, given how many there are. \r\n\r\nThis is really where zone scaling and a mild case of altoholism really work together.\r\nI suggest taking stock and looking at how far you are through [url=achievement=1676]Loremaster of Eastern kingdoms[\/url] and [url=achievement=1678]Loremaster of Kalimdor[\/url]. Then decide where you want to begin.\r\n\r\nYou may wish to level some new alts. Perhaps play the opposing faction to which you normally play to complete some zones, or box off the continent you leveled up to 60 in.\r\nReally it\u2019s up to you\r\n\r\nOr just take your higher level character and start in the north and work your way down south. \r\nThe decision is yours to make.\r\n\r\n*You can also incorporate the Cataclysm zones of Hyjal, Uldum, and the Twilight Highlands into this as they\u2019re built in to Kalimdor (H & U) and Eastern Kingdoms (TH)\r\n\r\n[h3]What do I need to begin this journey?[\/h3]\r\n[ul][li]Patience[\/li]\r\n[li]Time[\/li]\r\n[li]A character you\u2019re willing to level to 120[\/li][\/ul]\r\n\r\n\r\n\r\n[h3]Optional things for your adventures[\/h3]\r\n[ul][li]The largest bags you can get your hands on - There will be a lot to sell[\/li]\r\n[li]An addon which automatically sells junk (this feature is built in to many other addons\/UI compilations so you may already have this[\/li]\r\n[li]A guild tabard (if you're not already exalted)[\/li]\r\n[li]The addon [url=http:\/\/www.curse.com\/addons\/wow\/total-rp-3-storyline]Storyline[\/url] which aims to enhance the readability and immersion of questing[\/li]\r\n[\/ul]\r\n\r\n[h2]Additional outcomes once you've finished[\/h2]\r\n[ul]\r\n[li]A fair bit of gold in the bank[\/li]\r\n[li]The desire to never do another quest, ever again.[\/li]\r\n[li]Lots of new rep with factions and your guild[\/li]\r\n[li]A shiny new tabard[\/li]\r\n[li]An absolute boatload of achievements. Honestly there are so many I can't even begin to list them[\/li]\r\n[\/ul]\r\n\r\n\r\n[h2]Some tips[\/h2]\r\n[tabs name=\"Tips\"]\r\n[tab name=\"Go in order\"]\r\nWork through the zones in their leveling order, that way you get the quests that flow through zones. It all helps. There's also usually breadcrumb quests or a quest that then leads you on to the next zone.\r\nN.B. You [b]cannot[\/b] get the \"Hero's Call:\" quests once you're beyond the level of the zone e.g. Hero's Call: Westfall will not be available for a level 100[\/tab]\r\n[tab name=\"Read the quests\"]\r\nRead the quests. Not the whole story, but make sure you know what you've got to do.\r\n\r\n[\/tab]\r\n[tab name=\"Don't be put off!\"]\r\nYes, there is a lot to do, but don't be put off!\r\nBreak it down, decide to do 2 zones a week or something - It's really up to you!\r\nSome zones take longer than others, some have more travelling, some have a lot of cutscenes, and some barely take any time at all.\r\nTake your time.[\/tab]\r\n[\/tabs]\r\n\r\n[hr]\r\n[h3]Loot[\/h3]\r\nI know it's a chore, but some zones come to a standstill until you loot a corpse for an item that starts a new quest line. There are countless times that myself and friends have found there are no other quests because we've not looted one of the hundreds of corpses. Luckily AoE looting makes this thousands of times easier. Just turn off auto-loot otherwise your bags might fill a little faster than you anticipated. Some addons will allow you so auto-loot selected items; gold and quest only items, for example.\r\nYou can check the [url=https:\/\/www.wowhead.com\/quests?filter=cr=19:34:44;crs=3:1:1;crv=0:0:0]wowhead quest page with applied filter[\/url] to see a list of quest-starting items.\r\nAdd your own faction filter then sort by zone and you're all sorted!\r\n\r\n[h3]Don't know where you were up to in a zone?[\/h3]\r\nFor the zones where you're half way through the quests there are a couple of ways to pick up the quest lines again.\r\n \r\n[tabs name=\"half way through\"]\r\n[tab name=\"Fly around\"]\r\nThe simplest method is to simply fly around the zones, around the camps\/cities\/sites with NPCs hoping to see an exclamation mark. It's not necessarily the best or most efficient but, like I said, it is the simplest.\r\n[\/tab]\r\n[tab name=\"Make use of Wowhead!\"]\r\nMake use of wowhead!\r\nHead over to their [url=https:\/\/www.wowhead.com\/quest-completion-tracker]Quest Completion Tracker[\/url] and load your character. Then choose your zone and change the tickbox to Incomplete and tah-dah!\r\n\r\nYou can click through to the quest for further information.\r\n[\/tab]\r\n[tab name=\"Quest Completist\"]\r\nA third way is to use an addon known as [url=http:\/\/www.curse.com\/addons\/wow\/quest_completist]Quest Completist[\/url]. It's pretty simple really. It just has a database of all the in-game quests and you can use it to see which ones you have and haven't done.\r\nThen all you have to do is a quick search on Wowhead and there you have it.\r\nMy advice is to disable the showing of completed quests - unless you like exclamation marks.\r\n[\/tab]\r\n[\/tabs]\r\n[hr]\r\n[h3]Things to remember[\/h3]\r\n[ul]\r\n[li]Please, take breaks. Your brain will go numb after 8 hours of low-level questing. It's not good for your eyes either.[\/li]\r\n[li]Stay hydrated![\/li]\r\n[li]Chat to people in guild chat, discord, communities - They will help to keep you sane.[\/li]\r\n[li]Take breaks, do something else, some world quests or a couple of dungeons.[\/li]\r\n[li]Empty your bags pretty often. They will fill up with junk faster than you think![\/li]\r\n[\/ul]\r\n\r\n[h3]A final word[\/h3]\r\nI wish you all the best in trying this achievement.\r\nGood luck! Stick at it.\r\n\r\nWhen a new expansion is launched with new requirements for Loremaster your achievement is not stripped from you and you don't need to do them to keep your title, but if you don't can you really call yourself a true Loremaster?\r\n\r\nShould you get stuck check the forums, comments, and ask the community.\r\n\r\nAs a [b]final[\/b] solution contact a GM. \r\nSometimes quests [b]will[\/b] bug and there is nothing you can do about it. \r\nNo amount of abandoning\/re-accepting, relogging or waiting an hour will help.\r\nI had a terrible problem in Northern Barrens where an NPC would flat-out refuse to offer a quest (of course it was the last quest I needed there) so I had to contact a GM.\r\n\r\nAny suggestions\/corrections\/comments welcome in the comments below.", "guide-body", {"allow":30,"disabledEnvironments":{"ptr":true,"ptr2":true,"beta":false,"d4ptr":false,"d4beta":false,"classicptr":false}});

    WH.Page.Guide.initStyling();

                <noscript><br /><br /><h2 class="heading-size-2">About this guide</h2><br />This guide will hopefully outline a little more about the Loremaster achievement and how you can obtain it along with a few tips and tricks along the way.<br /><br />**I don't have any access to Shadownlands beta so I've not been able to start an update for the upcoming xpac. I will try to have this done as soon as I can after the xpac launches**<br /><br /><h2 class="heading-size-2">So what’s changed?</h2><br />Since the last update of this guide all the zones now follow the same style. Gone are the days of “Complete 70 quests in Eastern Plaguelands” and we’re now in a “Complete the storyline” style eg. <a href="https://www.wowhead.com/achievement=4892">Eastern Plagulands Quests</a><br />So now you actually get to follow the lore and story arc of a zone. How befitting of a Loremaster.<br />Also - Zone scaling. Just that little update they dropped in.<br /><br /><h3 class="heading-size-3">What does this actually mean for me?</h3><br />Firstly, in my opinion this makes the whole task more engaging. I feel like I’m now involved in a plot rather than just running around clearing all the little orange ! on the map.<br /><br />Along with zone scaling this presents the perfect opportunity to level up some alts and visit zones you haven’t previously completed. Zone scaling has also meant that it’s harder to break a quest where you’re not required to kill a mob, rather weaken it. So long as you’re at a level reasonably appropriate to the zone range.<br /><br /><h2 class="heading-size-2">Where to begin</h2><br />It’s worth noting that this storyline style has been in place since Mists of Pandaria so if you’ve been playing since then you’ve probably made a fairly good start.<br /><a href="https://www.wowhead.com/achievement=11157">Loremaster of Legion</a> and <a href="https://www.wowhead.com/achievement=9833">Loremaster of Draenor</a> have both been required to unlock flying for their respective continents so you may have already completed these.<br />So my advice is to look back and ensure that you’ve complete the BFA questlines, then the Legion zones, Warlords, and then Pandaria.<br /><br />Battle for Azeroth doesn’t have “Loremaster of” achievements, rather it has <a href="https://www.wowhead.com/achievement=12593"> Kul Tourist</a> and <a href="https://www.wowhead.com/achievement=12479">Zandalar Forever!</a><br /><i>Sidenote: These aren't required for <a href="https://www.wowhead.com/achievement=7520">The Loremaster</a> but you can hardly call yourself a Loremaster if you don't get them!</i><br /><br />For a more on the BFA Pathfinder to unlock flying please see <a href="https://www.wowhead.com/guide=6213">this guide</a><br /><br />Once you’ve looked at the more recent expansions take a look at the zones for Cataclysm*, Northrend, Outland, and Eastern Kingdoms &amp; Kalimdor.<br /><br />The Vanilla zones are really the most daunting, given how many there are. <br /><br />This is really where zone scaling and a mild case of altoholism really work together.<br />I suggest taking stock and looking at how far you are through <a href="https://www.wowhead.com/achievement=1676">Loremaster of Eastern kingdoms</a> and <a href="https://www.wowhead.com/achievement=1678">Loremaster of Kalimdor</a>. Then decide where you want to begin.<br /><br />You may wish to level some new alts. Perhaps play the opposing faction to which you normally play to complete some zones, or box off the continent you leveled up to 60 in.<br />Really it’s up to you<br /><br />Or just take your higher level character and start in the north and work your way down south. <br />The decision is yours to make.<br /><br />*You can also incorporate the Cataclysm zones of Hyjal, Uldum, and the Twilight Highlands into this as they’re built in to Kalimdor (H &amp; U) and Eastern Kingdoms (TH)<br /><br /><h3 class="heading-size-3">What do I need to begin this journey?</h3><br /><ul><li>Patience</li><li>Time</li><li>A character you’re willing to level to 120</li></ul><br /><br /><h3 class="heading-size-3">Optional things for your adventures</h3><br /><ul><li>The largest bags you can get your hands on - There will be a lot to sell</li><li>An addon which automatically sells junk (this feature is built in to many other addons/UI compilations so you may already have this</li><li>A guild tabard (if you're not already exalted)</li><li>The addon <a href="http://www.curse.com/addons/wow/total-rp-3-storyline" rel="nofollow">Storyline</a> which aims to enhance the readability and immersion of questing</li></ul><br /><br /><h2 class="heading-size-2">Additional outcomes once you've finished</h2><br /><ul><li>A fair bit of gold in the bank</li><li>The desire to never do another quest, ever again.</li><li>Lots of new rep with factions and your guild</li><li>A shiny new tabard</li><li>An absolute boatload of achievements. Honestly there are so many I can't even begin to list them</li></ul><br /><br /><h2 class="heading-size-2">Some tips</h2><br /><br />Work through the zones in their leveling order, that way you get the quests that flow through zones. It all helps. There's also usually breadcrumb quests or a quest that then leads you on to the next zone.<br />N.B. You <b>cannot</b> get the &quot;Hero's Call:&quot; quests once you're beyond the level of the zone e.g. Hero's Call: Westfall will not be available for a level 100<br /><br />Read the quests. Not the whole story, but make sure you know what you've got to do.<br /><br />Yes, there is a lot to do, but don't be put off!<br />Break it down, decide to do 2 zones a week or something - It's really up to you!<br />Some zones take longer than others, some have more travelling, some have a lot of cutscenes, and some barely take any time at all.<br />Take your time.<br /><br /><h3 class="heading-size-3">Loot</h3><br />I know it's a chore, but some zones come to a standstill until you loot a corpse for an item that starts a new quest line. There are countless times that myself and friends have found there are no other quests because we've not looted one of the hundreds of corpses. Luckily AoE looting makes this thousands of times easier. Just turn off auto-loot otherwise your bags might fill a little faster than you anticipated. Some addons will allow you so auto-loot selected items; gold and quest only items, for example.<br />You can check the <a href="https://www.wowhead.com/quests?filter=cr=19:34:44;crs=3:1:1;crv=0:0:0">wowhead quest page with applied filter</a> to see a list of quest-starting items.<br />Add your own faction filter then sort by zone and you're all sorted!<br /><br /><h3 class="heading-size-3">Don't know where you were up to in a zone?</h3><br />For the zones where you're half way through the quests there are a couple of ways to pick up the quest lines again.<br /><br />The simplest method is to simply fly around the zones, around the camps/cities/sites with NPCs hoping to see an exclamation mark. It's not necessarily the best or most efficient but, like I said, it is the simplest.<br /><br />Make use of wowhead!<br />Head over to their <a href="https://www.wowhead.com/quest-completion-tracker">Quest Completion Tracker</a> and load your character. Then choose your zone and change the tickbox to Incomplete and tah-dah!<br /><br />You can click through to the quest for further information.<br /><br />A third way is to use an addon known as <a href="http://www.curse.com/addons/wow/quest_completist" rel="nofollow">Quest Completist</a>. It's pretty simple really. It just has a database of all the in-game quests and you can use it to see which ones you have and haven't done.<br />Then all you have to do is a quick search on Wowhead and there you have it.<br />My advice is to disable the showing of completed quests - unless you like exclamation marks.<br /><br /><h3 class="heading-size-3">Things to remember</h3><br /><ul><li>Please, take breaks. Your brain will go numb after 8 hours of low-level questing. It's not good for your eyes either.</li><li>Stay hydrated!</li><li>Chat to people in guild chat, discord, communities - They will help to keep you sane.</li><li>Take breaks, do something else, some world quests or a couple of dungeons.</li><li>Empty your bags pretty often. They will fill up with junk faster than you think!</li></ul><br /><br /><h3 class="heading-size-3">A final word</h3><br />I wish you all the best in trying this achievement.<br />Good luck! Stick at it.<br /><br />When a new expansion is launched with new requirements for Loremaster your achievement is not stripped from you and you don't need to do them to keep your title, but if you don't can you really call yourself a true Loremaster?<br /><br />Should you get stuck check the forums, comments, and ask the community.<br /><br />As a <b>final</b> solution contact a GM. <br />Sometimes quests <b>will</b> bug and there is nothing you can do about it. <br />No amount of abandoning/re-accepting, relogging or waiting an hour will help.<br />I had a terrible problem in Northern Barrens where an NPC would flat-out refuse to offer a quest (of course it was the last quest I needed there) so I had to contact a GM.<br /><br />Any suggestions/corrections/comments welcome in the comments below.</noscript>            </div>

        <script>
        
var lv_comments0 = [{"commentv2": 1, "number": 0, "id": 1525579, "nreplies": 4, "sticky": 0, "user": "518484", "body": "Cool guide. How long did you spend by making loremaster? and did you enjoyed it or you enjoyed only receiving achievements?", "date": "2011-09-23T10:31:39-05:00", "rating": 8, "indent": 0, "roles": 0, "deleted": 0, "outofdate": 0, "userRating": 0, "replies": [{"body": "Erm, I don't remember exactly how long. I think around 2/3 weeks. Just questing as much as I could. Undoubtedly I could have done it faster had I not wasted time with other things, we all know how distracting /g can be.  Yes, I did enjoy it. I only started playing WoW a couple of months before Cataclysm so I just wanted to level as fast as I could. I took the time to actually read/learn some of the Lore. A very small amount.  All in all, it was good fun.  Why else would I want to do it a second time?", "creationdate": "2011-09-25T18:55:18-05:00", "id": 266986, "rating": 7, "commentid": 1525579, "dataTree": 1, "roles": 256, "username": "commenter-1", "markupDisabledEnvironments": {"ptr": true, "ptr2": true, "beta": false, "d4ptr": false, "d4beta": false, "classicptr": false}, "downvotedByUser": false, "reportedByUser": false, "votedByUser": false}, {"body": "I am in half the way and...why i would be doing it again...NOT COZ I LIKE IT..just coz i love the epic vanilla/burning crusade storyline", "creationdate": "2011-10-31T12:15:49-05:00", "id": 274448, "rating": 1, "commentid": 1525579, "dataTree": 1, "roles": 0, "username": "commenter-2", "markupDisabledEnvironments": {"ptr": true, "ptr2": true, "beta": false, "d4ptr": false, "d4beta": false, "classicptr": false}, "downvotedByUser": false, "reportedByUser": false, "votedByUser": false}, {"body": "Thanks for your comments :D  There are some excellent bits in there!  [u]Especially[/u] the guild tabard! You'll hit your 4k rep a week extremely easily.  I will just point out a couple of things; I do mention following the zones, sure I could have phrased it better. The 100 a week is a mere suggestion/idea/example for those who don't want to/cannot spend 7 days a week playing WoW and questing.  (The, erm, pleasure of being unemployed allowed me to do this achievement rather speedily compared to someone with commitments.)", "creationdate": "2011-11-09T16:11:17-06:00", "id": 276721, "rating": 2, "commentid": 1525579, "dataTree": 1, "roles": 256, "username": "commenter-1", "markupDisabledEnvironments": {"ptr": true, "ptr2": true, "beta": false, "d4ptr": false, "d4beta": false, "classicptr": false}, "downvotedByUser": false, "reportedByUser": false, "votedByUser": false}, {"body": "Yes, you did mention the region ordering, and sorry, I should have acknowledged it.  I wanted to expand though because I think it's a big deal.  If you get it right, especially within a region, you avoid the need for all the tedious flying around looking for quests that some people do.  [Okay, I did that once in Northrend, but I'm not proud of the fact!]  I also should have mentioned that if you can't find a breadcrumb to get to a region, look up where the Hero's Call would have taken you (the end NPC) and start the region there.", "creationdate": "2011-11-10T09:14:18-06:00", "id": 276884, "rating": 2, "commentid": 1525579, "dataTree": 1, "roles": 0, "username": "833385", "markupDisabledEnvironments": {"ptr": true, "ptr2": true, "beta": false, "d4ptr": false, "d4beta": false, "classicptr": false}, "downvotedByUser": false, "reportedByUser": false, "votedByUser": false}], "dataTree": 1, "markupDisabledEnvironments": {"ptr": true, "ptr2": true, "beta": false, "d4ptr": false, "d4beta": false, "classicptr": false}, "lastEdit": ["2011-09-24T14:10:09-05:00", 1, "518484"]}, {"commentv2": 1, "number": 1, "id": 1561126, "nreplies": 0, "sticky": 0, "user": "759155", "body": "Nice Guide!\r\n\r\nShame i'll probably never use it because I hate questing, but its a nice guide! ;>", "date": "2011-11-02T18:37:24-05:00", "rating": 5, "indent": 0, "roles": 0, "deleted": 0, "outofdate": 0, "userRating": 0, "replies": [], "dataTree": 1, "markupDisabledEnvironments": {"ptr": true, "ptr2": true, "beta": false, "d4ptr": false, "d4beta": false, "classicptr": false}}, {"commentv2": 1, "number": 2, "id": 1567546, "nreplies": 1, "sticky": 0, "user": "833385", "body": "It took me several months to get Loremaster, not weeks, but I didn't start at level 85.  I levelled to 60 through Kalimdor and started then.  I got the achievement  at about 3800 quests, doing  roughly 10-15 quests an hour when you include peripheral stuff like levelling fishing, etc.  This is over the mandatory number of quests because each region has extras and I like to finish most of them.\n\nBut if as the guide says you do 100 quests a week, and you've done 1000 before you start, you are still looking at 6 months.  I reckon I did more each week than that, but you can check the stats page to see what you've been doing up until now and do the maths relevant to you.  If you don't enjoy questing I reckon you'd be mad to do it.\n\nI'll add some points to an excellent guide if I might.\n\n1/   Go with the flow.  Each continent breaks down into regions and the regions follow logical flows.  If you do them in order, life will be much easier.  Azeroth and Cataclysm are very good about this flow and Northrend fairly good.  Only Outland makes the ordering difficult.\n\nFor example, in Eastern Kingdoms dwarves and gnomes start in Dun Morogh (1-10) then are \"expected\" to go to Loch Modan (10-20), Wetlands (20-25), Arathi Highlands (25-30) and the Hinterlands (30-35).  For humans it's Elwynn Forest (1-10) Westfall (10-15) Redridge (15-20), Duskwood (20-25), Northern Stranglethorn (25-30) and Cape of Stranglethorn (30-35).  If you follow an expected track you will usually find breadcrumb quests that lead you to the next region instead of the Hero's Call (or Warchief's Command) quests that you will probably be too high a level to get - so the breadcrumb for Westfall is in Elwynn Forest.  These quests count, so by flowing you have one quest less to do when you get there.\n\nThere's also flow within most regions.  It's not hard and fast, but especially in Azeroth you tend to have quest hubs, and when you've finished a hub, there'll be a quest that leads you to the next hub.  If you find the expected flow, you'll also find all the quests you need without breaking sweat.\n\nIf you find a quest in an area you haven't been led to, perhaps while gathering herbs or mining, jot it down or check it out rather than just taking it.  Some breadcrumb quests become unavailable if the quests that they lead to are taken.  That brings me to...\n\n2/   Start a document for quest notes on your computer.  Never abandon a quest without writing it down!  Open up a text document and jot down any quests you abandon, and if you move away from a hub without taking all quests at the hub, write that down too.  Sometimes hubs fork questlines and you are expected to come back to the hub to get the next set of quests.  Fine if you've picked up the starter quests in your log (which is ideal), but otherwise a quick note will save headaches.  There are addons that will take the place of this if you prefer.\n\n3/   Check quests to dungeons on wowhead.  Quests which end in a instance don't usually count for Loremaster, but you will often be sent to see someone standing outside the instance portal, and these quests typically do count, especially if it's in the same region.\n\n4/   Don't just miss out quests you think are dailies or repeaters - check it.  Daily quests don't count, but there are quests with a similar name that are identical and done first which do count.  So Bombing Run counts, but Bomb Them Again doesn't.  As another example there are four separate quests called Membership Benefits which are each identical and repeatable, just done at different reputation levels.  These can count four for the region total (Nagrand).\n\n5/  Outland regions are tough to complete if you try to do them at the nominal level or thereabouts.  You certainly have to do some of the group quests and can't solo them until much higher level.  ETA: And the Outland regions are more dependent on each other than elsewhere, so if you can't find all the quests in some regions, (such as Nagrand or Blade's Edge), don't panic.  It might just be you need to do parts of another region first. \n\n6/  Buy the fastest mount and travel speed you can.  If you start at 85 you'll probably already have Azeroth flying, but if you start at a lower level, spend the money to upgrade speed as soon as you have it.  As the guide says, you'll end up with money to spare and this can save you a lot of time.  If you follow the human flow first, it brings exalted of Stormwind and makes your flight purchases much cheaper.  I'm guessing an orc track will do the same for Og.\n\n7/  Buy a guild tabard before you start on the Cata quests if you have a decent guild.  A good guild gets you cheaper goods and repairs, and wearing a guild tabard while questing will get you to exalted and the nice goodies in the shop.  It'll also get you a few gz's and approving noises the day you get Fading into Twilight, Loremaster of Cataclysm, The Loremaster and that huge grin all over your face!", "date": "2011-11-09T09:32:04-06:00", "rating": 22, "indent": 0, "roles": 0, "deleted": 0, "outofdate": 0, "userRating": 0, "replies": [{"body": "An addition to #4: the initial quests that unlock dailies will be yellow in your quest log, and won't have (Daily) next to the quest name. This is an easy way to check if you accidentally picked up a daily, especially if they are automatically offered after completing a different quest!", "creationdate": "2016-03-24T07:28:19-05:00", "id": 935397, "rating": 1, "commentid": 1567546, "dataTree": 1, "roles": 0, "username": "commenter-3", "markupDisabledEnvironments": {"ptr": true, "ptr2": true, "beta": false, "d4ptr": false, "d4beta": false, "classicptr": false}, "downvotedByUser": false, "reportedByUser": false, "votedByUser": false}], "dataTree": 1, "markupDisabledEnvironments": {"ptr": true, "ptr2": true, "beta": false, "d4ptr": false, "d4beta": false, "classicptr": false}, "lastEdit": ["2011-11-10T08:33:53-06:00", 1, "833385"]}, {"commentv2": 1, "number": 3, "id": 1633932, "nreplies": 0, "sticky": 0, "user": "commenter-4", "body": "nice guide, just one thing though...i think you should change the wowwiki link to \r\nwowpedia.org ( not sure if allowed to post sites, if not plz delete )\r\nbecause wiki has lots of viruses / trojans on it now + wowpedia is better set out.\r\n\r\nthanks  =D", "date": "2012-03-01T20:51:24-06:00", "rating": 3, "indent": 0, "roles": 0, "deleted": 0, "outofdate": 0, "userRating": 0, "replies": [], "dataTree": 1, "markupDisabledEnvironments": {"ptr": true, "ptr2": true, "beta": false, "d4ptr": false, "d4beta": false, "classicptr": false}}, {"commentv2": 1, "number": 4, "id": 1697305, "nreplies": 0, "sticky": 0, "user": "920140", "body": "I'd like to add my 2p here:\r\n\r\n- Breakdown by region. Yes, you probably will pick up the breadcrumb quests halfway on a region to another, but don't leave the region you are in it until all other quests are exhausted. It helps to keep control.\r\n\r\n- Level-bound quests: Let me explain myself here: Specially in Northrend, there are few (very few or just one) quests that require you to ride a giant on the shoulder (like a vehicle), and defeat another giant (I will check its name later). Well, you don't need to complete this quest, you can complete all others and still get the sub-loremaster achievement for the zone you are in. Why to avoid similar to these? No matter your level, power, stamina, you must survive based on the level of the \"vehicle\", so it can get pretty hard to do. The same applies to a quest in Outland, where a Wizard or Mage trade places with you (your body) so you must fight with HIS Health-Points and skills. So some quests can get you with your epic pants down.", "date": "2012-08-07T21:03:25-05:00", "rating": 3, "indent": 0, "roles": 0, "deleted": 0, "outofdate": 0, "userRating": 0, "replies": [], "dataTree": 1, "markupDisabledEnvironments": {"ptr": true, "ptr2": true, "beta": false, "d4ptr": false, "d4beta": false, "classicptr": false}}];
