version: 2

updates:
  # The uv ecosystem updates pyproject.toml ranges and uv.lock together; the pip ecosystem
  # changed only pyproject.toml, so CI (uv sync --frozen) kept testing the old versions.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
