name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Lockfile matches pyproject.toml
        run: make lock-check

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra redis

      - name: Ruff
        run: make lint

      - name: Mypy
        run: make typecheck

      - name: Import boundaries
        run: make lint-boundaries

      - name: Complexity gate
        run: make complexity-gate

      - name: Dead code
        run: make deadcode

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra redis

      # Same target `make check` runs: the fast suite over every package, failing below the
      # coverage floor set in the Makefile.
      - name: Unit tests (non-live) with coverage floor
        run: make coverage

  isolated-install:
    name: Isolated install (${{ matrix.cli }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: wowhead-cli
            cli: wowhead
          - package: warcraftlogs-cli
            cli: warcraftlogs
          - package: simc-cli
            cli: simc
          - package: raiderio-cli
            cli: raiderio
          - package: warcraft-wiki-cli
            cli: warcraft-wiki
          - package: icy-veins-cli
            cli: icy-veins
          - package: method-cli
            cli: method
          - package: lorrgs-cli
            cli: lorrgs
          - package: raidbots-cli
            cli: raidbots
          - package: blizzard-api-cli
            cli: blizzard
          - package: curseforge-cli
            cli: curseforge
          - package: warcraft-cli
            cli: warcraft
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Verify provider wheel and declared dependencies outside the checkout
        run: uv run --no-project --python 3.12 scripts/verify_provider_wheels.py --package ${{ matrix.package }}

  wheel:
    name: Installed wheel (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        run: uv build --wheel

      - name: Verify the installed release wheel outside the checkout
        run: uv run --no-project --python ${{ matrix.python-version }} scripts/verify_wheel.py dist/*.whl

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: warcraft-wheel-${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  redis-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra redis

      - name: Verify real Redis with guarded synthetic provider HTTP
        env:
          VERIFY_REDIS_URL: redis://127.0.0.1:6379/0
          VERIFY_REDIS_OUTAGE_URL: redis://127.0.0.1:6380/0
          VERIFY_REDIS_OUTAGE_CONTAINER: warcraft-verify-outage-ci
        run: |
          docker run --rm -d --name "$VERIFY_REDIS_OUTAGE_CONTAINER" \
            --publish 127.0.0.1:6380:6379 redis:7-alpine \
            redis-server --save '' --appendonly no
          trap 'docker rm -f "$VERIFY_REDIS_OUTAGE_CONTAINER" >/dev/null' EXIT
          for ((attempt = 0; attempt < 30; attempt++)); do
            if docker exec "$VERIFY_REDIS_OUTAGE_CONTAINER" redis-cli ping >/dev/null; then
              break
            fi
            sleep 1
          done
          docker exec "$VERIFY_REDIS_OUTAGE_CONTAINER" redis-cli ping
          uv run pytest -q tests/test_redis_integration.py

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # GITLEAKS_LICENSE is only required for organization-owned repositories;
      # personal repositories run the action without it.
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
